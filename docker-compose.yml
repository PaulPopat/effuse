services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile
      target: auth
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      SMTP_EMAIL_FROM: account@effuse.chat
      SMTP_HOST: maildev
      SMTP_PORT: "1025"
      SMTP_USERNAME: test_user
      SMTP_PASSWORD: test_password

      DATABASE_PROVIDER: postgres
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: effuse
      POSTGRES_PASSWORD: test_database

      JWT_KEY: secret_jwt_key_that_is_secret_and_hidden
      JWT_ISSUER: effuse.chat

      UI_ORIGIN: http://localhost:8081

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    restart: unless-stopped
    ports:
      - 8082:8080
    environment:
      DATABASE_PROVIDER: sqlite

      JWT_KEY: secret_jwt_key_that_is_secret_and_hidden
      JWT_ISSUER: effuse.server

      UI_ORIGIN: http://localhost:8081
      SERVER_URL: http://server:8080
      EFFUSE_URL: http://auth:8080
    volumes:
      - server:/data

  maildev:
    image: maildev/maildev
    restart: unless-stopped
    ports:
      - 1080:1080
      - 1025:1025
    environment:
      MAILDEV_OUTGOING_USER: test_user
      MAILDEV_OUTGOING_PASS: test_password

  postgres:
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: effuse
      POSTGRES_PASSWORD: test_database
    volumes:
      - postgres:/var/lib/postgresql

volumes:
  postgres:
  server:
