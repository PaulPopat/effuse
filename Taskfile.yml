version: '3'

dotenv: ['.env']

tasks:
  restore: dotnet restore

  build:
    cmds:
      - dotnet build Effuse.sln /property:GenerateFullPaths=true /consoleloggerparameters:NoSummary
    sources:
      - Effuse.Auth/**/*.cs
      - Effuse.Server/**/*.cs
      - Effuse.Core/**/*.cs
    generates:
      - Effuse.Auth/bin/**/*
      - Effuse.Server/bin/**/*
      - Effuse.Core/bin/**/*

  run:auth:
    deps:
      - build
    cmd: dotnet run --project ./Effuse.Auth/Effuse.Auth.csproj
    env:
      ASPNETCORE_ENVIRONMENT: Development
      DATABASE_PROVIDER: sqlite
      SQLITE_FILE: "{{.TASKFILE_DIR}}/Effuse.Auth/database.sqlite"

  run:server:
    deps:
      - build
    cmd: dotnet run --project ./Effuse.Server/Effuse.Server.csproj
    env:
      ASPNETCORE_ENVIRONMENT: Development
      DATABASE_PROVIDER: sqlite
      SQLITE_FILE: "{{.TASKFILE_DIR}}/Effuse.Server/database.sqlite"

  run:all:
    internal: true
    deps:
      - run:auth
      - run:server

  run:
    cmds:
      - task: build
      - task: run:all

  dev:
    cmds:
      - task: migrate
      - task: run

  ui:
    dir: "{{.TASKFILE_DIR}}/Effuse.UserInterface"
    cmd: npm run start
    env:
      EXPO_PUBLIC_AUTH_BASE: "{{.EFFUSE_URL}}"

  test:
    dir: "{{.TASKFILE_DIR}}/Effuse.ApiTests"
    cmd: npm run test

  migrate:auth:
    dir: "{{.TASKFILE_DIR}}/Effuse.AuthMigration"
    cmd: npm run migrate:latest
    env:
      DATABASE_PROVIDER: sqlite
      SQLITE_FILE: "{{.TASKFILE_DIR}}/Effuse.Auth/database.sqlite"

  migrate:server:
    dir: "{{.TASKFILE_DIR}}/Effuse.ServerMigration"
    cmd: npm run migrate:latest
    env:
      DATABASE_PROVIDER: sqlite
      SQLITE_FILE: "{{.TASKFILE_DIR}}/Effuse.Server/database.sqlite"

  migrate:
    cmds:
      - task: migrate:auth
      - task: migrate:server

  publish:
    cmds:
      - docker build --platform linux/amd64,linux/arm64,linux/arm/v7 --target effuse-auth:latest --target auth .
      - docker build --platform linux/amd64,linux/arm64,linux/arm/v7 --target effuse:latest --target server .